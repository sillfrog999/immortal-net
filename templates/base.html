<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ImmortalNet{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="topnav">
    <a href="{{ url_for('index') }}" class="logo">IMMORTAL<span>NET</span></a>
    <div class="nav-links">
        <a href="{{ url_for('browser_ui') }}">Browser</a>
        {% if current_user() %}
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('create') }}">+ Create</a>
            <form action="{{ url_for('logout') }}" method="post" class="inline-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="link-button">Logout</button>
            </form>
        {% else %}
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('register') }}" class="btn-small">Register</a>
        {% endif %}
    </div>
</nav>
<main class="container">
{% block content %}{% endblock %}
</main>
</body>
</html>
