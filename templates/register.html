{% extends "base.html" %}
{% block title %}Register - ImmortalNet{% endblock %}
{% block content %}
<div class="auth-box">
    <h1>Create your account</h1>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Username</label>
        <input type="text" name="username" pattern="[A-Za-z0-9_]{3,32}" required autofocus>
        <label>Password</label>
        <input type="password" name="password" minlength="8" required>
        <button type="submit" class="btn btn-primary full-width">Register</button>
    </form>
    <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
